name: patient_app
description: "Patient / Caller app — Ambulance Tracking & Dispatch. UI built on design-tokens.md v1 (frozen); Firebase backend wired behind AppState."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Design-system deps (from the frozen design project) ────────────
  # flutter_map/latlong2 pins match the design project exactly — the UI
  # (notably the request-flow pin drag, which uses manual Web-Mercator
  # math) was verified against flutter_map 7. See docs/design/firebase-backend-handoff.md §7.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1

  # ── Firebase backend (from the existing wired app) ─────────────────
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_database: ^12.6.0

  # ── Services layer (from the existing wired app) ───────────────────
  geolocator: ^14.1.1
  http: ^1.2.0
  url_launcher: ^6.3.0
  firebase_messaging: ^16.7.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
